workflows:
  clipora-v2-debug:
    name: Clipora V2 Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/notifications

    scripts:
      - name: Extract Clipora V2 source
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          test -f clipora-v2.zip
          unzip -o clipora-v2.zip -d "$CM_BUILD_DIR"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Configure Android SDK 36
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          if [ ! -d "$SDK_ROOT/platforms/android-36" ]; then
            "$SDKMANAGER" "platforms;android-36"
          fi

          if [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            "$SDKMANAGER" "build-tools;36.0.0"
          fi

      - name: Install Gradle 9.6
        script: |
          set -e
          if [ ! -x /tmp/gradle-9.6.0/bin/gradle ]; then
            curl -L --fail --retry 3 \
              https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
              -o /tmp/gradle-9.6.0-bin.zip
            unzip -q -o /tmp/gradle-9.6.0-bin.zip -d /tmp
          fi

      - name: Run unit tests
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          /tmp/gradle-9.6.0/bin/gradle --no-daemon testDebugUnitTest

      - name: Build Clipora V2 debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          /tmp/gradle-9.6.0/bin/gradle --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
